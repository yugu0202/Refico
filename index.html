<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" />
    <script>
      // Apply the saved choice before the app loads to avoid a light flash.
      (() => {
        let mode = "system";
        try {
          mode = localStorage.getItem("refico-theme") || "system";
        } catch {}
        const dark =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute(
          "data-mui-color-scheme",
          dark ? "dark" : "light",
        );
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#191c18"
          : "#fafaf9";
      })();
    </script>
    <link rel="icon" href="/favicon.ico?v=3" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" sizes="any" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png?v=3"
      sizes="180x180"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Refico" />
    <meta
      name="description"
      content="食材の在庫と、使った分の食費を記録するRefico"
    />
    <title>Refico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
